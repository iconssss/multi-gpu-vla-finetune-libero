<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Reliable VLA fine-tuning and evaluation pipeline</title>
  <desc id="desc">Four stages connect native LIBERO data, multi-GPU SmolVLA training, controlled closed-loop evaluation, and an honest scaling verdict.</desc>
  <rect width="1200" height="430" rx="24" fill="#f7f9fc"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Reliable VLA fine-tuning requires reliable evaluation</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="18" fill="#536079">Native contract → multi-GPU training → paired policy RNG → attributable closed-loop comparison</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="145" width="235" height="170" rx="18" fill="#ffffff" stroke="#4b77be" stroke-width="3"/>
    <text x="84" y="182" font-size="20" font-weight="700" fill="#214a84">1 · Native contract</text>
    <text x="84" y="220" font-size="17" fill="#172033">8D state · 2 cameras</text>
    <text x="84" y="250" font-size="17" fill="#172033">7D action · language</text>
    <text x="84" y="280" font-size="15" fill="#536079">Official LeRobot APIs</text>
    <rect x="335" y="145" width="235" height="170" rx="18" fill="#ffffff" stroke="#4b77be" stroke-width="3"/>
    <text x="359" y="182" font-size="20" font-weight="700" fill="#214a84">2 · 4-GPU DDP</text>
    <text x="359" y="225" font-size="28" font-weight="700" fill="#172033">3.82× speedup</text>
    <text x="359" y="258" font-size="17" fill="#172033">289 samples/s</text>
    <text x="359" y="288" font-size="15" fill="#536079">Optimizer-state resume</text>
    <rect x="610" y="145" width="235" height="170" rx="18" fill="#ffffff" stroke="#d68a24" stroke-width="3"/>
    <text x="634" y="182" font-size="20" font-weight="700" fill="#9a5b0b">3 · Confound found</text>
    <text x="634" y="220" font-size="17" fill="#172033">Task order changed</text>
    <text x="634" y="250" font-size="17" fill="#172033">flow-noise streams</text>
    <text x="634" y="280" font-size="15" fill="#536079">Raw comparison retired</text>
    <rect x="885" y="145" width="255" height="170" rx="18" fill="#ffffff" stroke="#2f8f65" stroke-width="3"/>
    <text x="909" y="182" font-size="20" font-weight="700" fill="#236b4d">4 · Paired evaluation</text>
    <text x="909" y="225" font-size="28" font-weight="700" fill="#172033">2/30 → 4/30</text>
    <text x="909" y="258" font-size="17" fill="#172033">5K → 20K checkpoint</text>
    <text x="909" y="288" font-size="15" fill="#536079">Weak positive; not significant</text>
    <g fill="#7b879d">
      <path d="M305 224h20l-8-8 5-5 17 17-17 17-5-5 8-8h-20z"/>
      <path d="M580 224h20l-8-8 5-5 17 17-17 17-5-5 8-8h-20z"/>
      <path d="M855 224h20l-8-8 5-5 17 17-17 17-5-5 8-8h-20z"/>
    </g>
  </g>
  <rect x="60" y="350" width="1080" height="2" fill="#dce2eb"/>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="17" fill="#536079">Main contribution: making stochastic checkpoint comparisons attributable before interpreting scale.</text>
</svg>
